# ==============================
# GUI 配置
# ==============================
gui:
  # GUI 标题前缀（用于事件识别）
  title_prefix: "§f[VP] "

  # 通用按钮
  close_button:
    material: BARRIER
    name: "§c关闭"
  confirm_button:
    material: GREEN_CONCRETE
    name: "§a确认"
  back_button:
    material: RED_CONCRETE
    name: "§c返回"

# ==============================
# 访客系统配置
# ==============================
visitors:
  # 是否启用访客系统
  enabled: true
  
  # 访客生成检查间隔（游戏时间tick，24000=24分钟）
  check_interval_ticks: 24000
  
  # 繁荣度阈值（需要达到此值才能生成访客）
  prosperity_threshold: 100
  
  # 访客停留时间（分钟）
  stay_duration_minutes: 10
  
  # 生成概率（0.0-1.0）
  spawn_probability: 0.3

  # 商人配置
  merchant:
    enabled: true
    # stock 是每位访客携带的总批次数；per_player_limit 是每名玩家最多购买的批次数
    # id 必须稳定且唯一，修改名称不会重置同一访客的库存记录
    # 商人出售的物品
    items:
      - id: village_token
        item: "villagerpro:village_token"
        stock: 3
        per_player_limit: 1
        price:
          - type: "vault"
            amount: 500
        name: "村庄令牌"
        description: "村庄升级材料"
        rarity: "rare"
        
      - id: golden_seed
        item: "villagerpro:golden_seed"
        stock: 4
        per_player_limit: 1
        price:
          - type: "playerpoints"
            amount: 100
        name: "金色种子"
        description: "提升农民效率"
        rarity: "epic"
        
      - id: quality_seeds
        item: WHEAT_SEEDS
        amount: 8
        stock: 12
        per_player_limit: 3
        price:
          - type: "vault"
            amount: 50
        name: "优质种子"
        description: "农民专属种子"
        rarity: "common"

  # 旅行者配置
  traveler:
    enabled: true
    # 旅行者提供的委托
    deals:
      - name: "收获南瓜"
        description: "帮我收集5个南瓜"
        item: "PUMPKIN"
        amount: 5
        reward:
          item: "JACK_O_LANTERN"
          amount: 1
        
      - name: "织布需求"
        description: "我需要10块白色羊毛"
        item: "WHITE_WOOL"
        amount: 10
        reward:
          item: "WHITE_WOOL"
          amount: 5
        
      - name: "美食需求"
        description: "给我3条鲑鱼"
        item: "SALMON"
        amount: 3
        reward:
          item: "PLAYER_HEAD"
          amount: 1

  # 节日使者配置
  festival:
    enabled: true
    # 节日名称（可添加更多节日）
    festivals:
      harvest:
        name: "丰收节"
        description: "秋季庆典，所有产出+50%"
        duration_hours: 48
        effect:
          production_boost: 1.5
          item: "PUMPKIN"
          amount: 10
          
      winter:
        name: "冬季节"
        description: "领取一份冬日药水礼物"
        duration_hours: 72
        effect:
          item: "POTION"
          amount: 1

# ==============================
# 村民个性与成长系统
# ==============================
personality:
  # 是否启用个性系统
  enabled: true
  
  # 忠诚度配置
  loyalty:
    # 基础忠诚度
    base_loyalty: 50
    # 最高忠诚度
    max_loyalty: 100
    
  # 情绪配置
  mood:
    # 基础情绪值
    base_mood: 70
    # 最高情绪值
    max_mood: 100
    
  # 互动奖励
  interactions:
    # 同一村民互动冷却（秒）
    cooldown_seconds: 30
    # 送礼影响
    gift_boost: 10
    # 保护村民奖励
    protection_reward: 5
    # 村庄升级奖励
    level_up_reward: 15

# ==============================
# 村庄装饰系统
# ==============================
decorations:
  # 是否启用装饰系统
  enabled: true
  
  # 装饰物品配置
  items:
    street_light:
      name: "路灯"
      description: "照亮村庄夜晚"
      material: TORCH
      cost:
        - type: "vault"
          amount: 100
        - type: "item"
          item: "GLASS"
          amount: 2
      prosperity_boost: 5
      world_interaction: true
      
    flower_bed:
      name: "花坛"
      description: "美化村庄环境"
      material: POPPY
      cost:
        - type: "item"
          item: "FLOWER_POT"
          amount: 1
        - type: "vault"
          amount: 50
      prosperity_boost: 3
      villager_interaction: true
      
    bench:
      name: "长椅"
      description: "村民休息场所"
      material: OAK_STAIRS
      cost:
        - type: "vault"
          amount: 200
      prosperity_boost: 4
      villager_sit: true

# ==============================
# 防御机制系统
# ==============================
defense:
  # 是否启用防御系统
  enabled: true
  
  # 守卫配置
  guard:
    # 村庄等级解锁要求
    level_requirement: 3
    # 守卫持续时间（分钟）
    duration_minutes: 5
    # 召唤成本
    cost:
      - type: "vault"
        amount: 200
      - type: "item"
        item: "IRON_INGOT"
        amount: 16
        
  # 避难所配置
  shelter:
    # 夜晚避难所
    auto_shelter:
      enabled: true
      trigger_world_time: 13000  # 夜晚时间
        
  # 村庄守护效果
  protection:
    # 生效范围（方块）
    range: 50
    # 怪物生成减少（百分比）
    monster_reduction: 10
    # 村民受到攻击时的保护
    villager_protection: true


# ==============================
# 村庄联盟系统
# ==============================
alliance:
  # 是否启用联盟系统（默认关闭）
  enabled: false
  
  # 联盟配置
  config:
    # 最多成员数
    max_members: 5
    # 最低村庄等级要求
    min_village_level: 2
    
# ==============================
# 生态联动系统
# ==============================
eco_chain:
  # 是否启用生态联动
  enabled: true
  # 加工职业按自己的工作周期从仓库取料；关闭后恢复旧版“生产时立即加工”
  stored_processing_enabled: true
  # 加工职业每级会增加一批周期处理能力，但不会超过配方自身上限
  processing_base_batches: 1
  # 达到配方批次上限后，额外等级仍会提高实际成品期望数量
  processing_output_bonus_per_level: 0.05
  
  # 职业协作链配置
  profession_chains:
    # 农业链：农民 → 面包师
    bread_chain:
      enabled: true
      chain:
        - profession: "farmer"
          produces: "WHEAT"
        - profession: "baker"
          consumes: "WHEAT"
          produces: "BREAD"
          ratio: 3  # 3小麦 -> 1面包
          
    # 畜牧业链：牧羊人 → 织布工
    wool_chain:
      enabled: true
      chain:
        - profession: "shepherd"
          produces: "WHITE_WOOL"
        - profession: "weaver"
          consumes: "WHITE_WOOL"
          produces: "WHITE_CARPET"
          ratio: 5  # 5羊毛 -> 1地毯
          
  # 新职业配置
  new_professions:
    baker:
      name: "面包师"
      icon: BREAD
      requires: "farmer"  # 需要农民作为前置
      produces: "BREAD"
      efficiency: 0.8
      
    weaver:
      name: "织布工"
      icon: "WHITE_WOOL"
      requires: "shepherd"  # 需要牧羊人作为前置
      produces: "WHITE_CARPET"
      efficiency: 0.6

  # 高优先级配方先尝试，因此高级成品会优先消耗上一步产物
  processing_recipes:
    pastry_baking:
      name: "糕点烘焙"
      profession: baker
      priority: 20
      max_batches_per_cycle: 2
      efficiency: 0.70
      inputs: {BREAD: 3}
      outputs: {COOKIE: 6}
    bread_baking:
      name: "面包烘焙"
      profession: baker
      priority: 10
      max_batches_per_cycle: 4
      efficiency: 0.80
      inputs: {WHEAT: 3}
      outputs: {BREAD: 1}
    textile_art:
      name: "织物工艺"
      profession: weaver
      priority: 20
      max_batches_per_cycle: 2
      efficiency: 0.65
      inputs: {WHITE_CARPET: 6}
      outputs: {PAINTING: 1}
    carpet_weaving:
      name: "地毯织造"
      profession: weaver
      priority: 10
      max_batches_per_cycle: 4
      efficiency: 0.75
      inputs: {WHITE_WOOL: 4}
      outputs: {WHITE_CARPET: 3}

