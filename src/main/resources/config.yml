        icon: FILLED_MAP
        effects:
          treasure_chance: 0.08

# ==============================
# 村民生活需求
# ==============================
needs:
  enabled: true
  check_interval_ticks: 1200
  auto_consume_threshold: 65
  workstation_comfort_per_hour: 6
  decay:
    hunger_per_hour: 8
    comfort_per_hour: 5
    health_per_hour: 3
  supplies:
    food:
      items: [BREAD, CARROT, POTATO]
      restore: 25
    comfort:
      items: [WHITE_WOOL, WHITE_CARPET]
      restore: 20
    health:
      items: [POTION]
      restore: 30
  efficiency:
    excellent_threshold: 75
    excellent_bonus: 0.10
    poor_threshold: 40
    poor_penalty: 0.20
    critical_threshold: 20
    critical_penalty: 0.40

# ==============================
# 实体工作站
# ==============================
workstations:
  enabled: true
  active_range: 8
  max_level: 3
  # 1级无额外倍率，2/3级分别增加15%/30%
  bonus_per_level: 0.15
  materials:
    farmer: COMPOSTER
    fisherman: BARREL
    shepherd: LOOM
    librarian: LECTERN
    priest: BREWING_STAND
    cartographer: CARTOGRAPHY_TABLE
    baker: SMOKER
    weaver: LOOM
  upgrade_costs:
    2:
      vault: 400
      item: IRON_INGOT
      amount: 8
    3:
      vault: 900
      item: DIAMOND
      amount: 2

# ==============================
# 每日村庄订单
# ==============================
orders:
  enabled: true
  daily_count: 3
  # 实际金币不超过同批货物当前市场清算价值，防止买入后立即交单套利
  market_value_cap_multiplier: 1.0
  # 数量和奖励会随村庄等级按 per_level 线性增长
  pool:
    wheat_supply:
      item: WHEAT
      amount: 32
      amount_per_level: 8
      reward_money: 160
      reward_money_per_level: 40
      reward_prosperity: 8
    fish_market:
      item: COD
      amount: 20
      amount_per_level: 5
      reward_money: 140
      reward_money_per_level: 35
      reward_prosperity: 7
    wool_contract:
      item: WHITE_WOOL
      amount: 16
      amount_per_level: 4
      reward_money: 180
      reward_money_per_level: 45
      reward_prosperity: 9
    library_request:
      item: BOOK
      amount: 12
      amount_per_level: 3
      reward_money: 220
      reward_money_per_level: 55
      reward_prosperity: 10
    potion_delivery:
      item: POTION
      amount: 8
      amount_per_level: 2
      reward_money: 260
      reward_money_per_level: 65
      reward_prosperity: 12
    bakery_shipment:
      item: BREAD
      amount: 12
      amount_per_level: 3
      reward_money: 240
      reward_money_per_level: 60
      reward_prosperity: 11
    pastry_crates:
      item: COOKIE
      amount: 24
      amount_per_level: 6
      reward_money: 320
      reward_money_per_level: 80
      reward_prosperity: 14
    artisan_exhibition:
      item: PAINTING
      amount: 4
      amount_per_level: 1
      reward_money: 420
      reward_money_per_level: 100
      reward_prosperity: 18

production_stats:
  # GUI 聚合最近多少分钟的生产事件
  window_minutes: 60
  # 生产日志保留天数
  retention_days: 7

# ==============================
# 动态市场
# ==============================
market:
  enabled: true
  sell_factor: 0.85
  buy_factor: 1.15
  liquidity: 256
  price_sensitivity: 1.0
  maximum_pressure: 3.0
  pressure_half_life_hours: 24
  minimum_price_multiplier: 0.50
  maximum_price_multiplier: 2.00
  maximum_transaction_amount: 64
  daily_volume_base: 128
  daily_volume_per_village_level: 32
  trade_history_retention_days: 30
  items:
    WHEAT: {base_price: 2.0}
    CARROT: {base_price: 1.5}
    POTATO: {base_price: 1.5}
    COD: {base_price: 4.0}
    SALMON: {base_price: 5.0}
    WHITE_WOOL: {base_price: 5.0}
    BOOK: {base_price: 12.0}
    POTION: {base_price: 20.0}
    MAP: {base_price: 15.0}
    OAK_PLANKS: {base_price: 1.0}
    EMERALD: {base_price: 25.0}
    BREAD: {base_price: 8.0}
    WHITE_CARPET: {base_price: 10.0}
    COOKIE: {base_price: 6.0}
    PAINTING: {base_price: 80.0}

# ==============================
# 村庄政策
# ==============================
policies:
  enabled: true
  # 选定后不可中途更换，避免玩家只在结算瞬间切换政策
  duration_hours: 24
  overtime:
    production_multiplier: 1.20
    needs_decay_multiplier: 1.25
  welfare:
    needs_decay_multiplier: 0.75
    consume_threshold_bonus: 15
    supply_restore_multiplier: 1.20
  export:
    market_sell_multiplier: 1.10
    market_buy_multiplier: 1.05
    order_reward_multiplier: 0.85
  reserve:
    capacity_multiplier: 1.20
    frozen_stock_fraction: 0.15

# ==============================
# 村庄危机
# ==============================
crises:
  enabled: true
  check_interval_ticks: 1200
  initial_delay_hours: 6
  roll_interval_hours: 12
  trigger_chance_per_roll: 0.25
  duration_hours: 24
  resolution_prosperity_reward: 10
  failure_prosperity_penalty: 15
  # 对应功能建筑每级削弱 15% 的危机负面幅度，而非直接抵消危机
  building_mitigation_per_level: 0.15
  types:
    harvest_failure:
      required_item: BREAD
      required_amount: 24
      required_per_level: 8
      production_multiplier: 0.65
    epidemic:
      required_item: POTION
      required_amount: 8
      required_per_level: 2
      production_multiplier: 0.80
      needs_decay_multiplier: 1.50
    fire:
      required_item: OAK_PLANKS
      required_amount: 32
      required_per_level: 8
      production_multiplier: 0.75
    trade_blockade:
      required_item: EMERALD
      required_amount: 16
      required_per_level: 4
      market_sell_multiplier: 0.65
      market_buy_multiplier: 1.35

# ==============================
# 商队贸易路线
# ==============================
caravans:
  enabled: true
  check_interval_ticks: 1200
  minimum_cargo: 8
  maximum_cargo: 64
  max_active_routes: 2
  history_retention_days: 30
  risk_reduction_per_village_level: 0.02
  destinations:
    capital:
      accepted_items: [BREAD, COOKIE, PAINTING, BOOK]
      return_item: EMERALD
      duration_minutes: 60
      return_value_multiplier: 0.75
      risk_chance: 0.10
    coast:
      accepted_items: [WHITE_WOOL, WHITE_CARPET, MAP]
      return_item: COD
      duration_minutes: 45
      return_value_multiplier: 0.80
      risk_chance: 0.08
    frontier:
      accepted_items: [BREAD, POTATO, CARROT]
      return_item: OAK_PLANKS
      duration_minutes: 30
      return_value_multiplier: 0.75
      risk_chance: 0.12
    apothecary:
      accepted_items: [BOOK, MAP, EMERALD]
      return_item: POTION
      duration_minutes: 90
      return_value_multiplier: 0.70
      risk_chance: 0.06

# ==============================
# 村庄功能建筑
# ==============================
buildings:
  enabled: true
  # 以核心为中心扫描 7×6×7 方块，不会强制加载区块
  scan_radius: 3
  scan_down: 1
  scan_up: 4
  max_level: 3
  minimum_core_distance: 7
  revalidation_delay_ticks: 20
  audit_interval_ticks: 2400
  audit_batch_size: 2
  types:
    granary:
      core: BARREL
      capacity_per_level: 100
      levels:
        1: {barrels: 4, planks: 16, roof_columns: 6}
        2: {barrels: 8, planks: 32, roof_columns: 8}
        3: {barrels: 12, planks: 48, roof_columns: 9}
    workshop:
      core: CRAFTING_TABLE
      production_bonus_per_level: 0.10
      levels:
        1: {furnaces: 2, anvils: 1, planks: 12, roof_columns: 6}
        2: {furnaces: 4, anvils: 2, planks: 24, roof_columns: 8}
        3: {furnaces: 6, anvils: 3, planks: 36, roof_columns: 9}
    clinic:
      core: BREWING_STAND
      decay_reduction_per_level: 0.15
      health_restore_bonus_per_level: 0.15
      levels:
        1: {beds: 2, brewing_stands: 1, bookshelves: 4, roof_columns: 6}
        2: {beds: 4, brewing_stands: 2, bookshelves: 8, roof_columns: 8}
        3: {beds: 6, brewing_stands: 3, bookshelves: 12, roof_columns: 9}

# ==============================
# 传承系统
# ==============================
legacy:
  # 是否启用传承系统
  # 当前版本尚未开放玩家入口，保留配置供后续版本迁移
  enabled: false
  
  # 传承配置
  config:
    # 传承所需等级
    min_level: 5
    # 技能继承比例
    skill_inheritance_percentage: 50
    # 传承材料
    scroll_item: "ENCHANTED_BOOK"
    scroll_cost: 1
    
  # 传承效果
  effects:
    # 提升村庄声望
    village_fame_boost: 25
    # 解锁特殊村民
    unlock_special_villagers: false

# ==============================
# 玩法模块开关
# ==============================
features:
  # 核心玩法模块
  eco_chain: true          # 生态联动
  visitors: true           # 访客系统
  personality: true        # 村民个性
  decorations: true        # 村庄装饰
  defense: true            # 防御机制
  legacy: false            # 传承系统（实验模块，当前无玩家入口）
  alliance: false          # 联盟系统（默认关闭）
  needs: true              # 村民生活需求
  workstations: true       # 实体工作站绑定与升级
  buildings: true          # 可检测、可失效的村庄功能建筑
  market: true             # 全服供需驱动的仓库交易市场
  policies: true           # 有实际收益与代价的限时村庄政策
  crises: true             # 可提交救援物资、会真实影响经营的限时危机
  caravans: true           # 有运输时间、风险和回程领取的资源转换路线

# ==============================
# 兼容性设置
# ==============================
compatibility:
  # 是否在村民死亡时自动移除绑定（避免僵尸村民残留）
  auto_cleanup_dead_villagers: true
  # 是否允许村民在非主世界工作（如生存世界）
  allow_work_in_all_worlds: false
