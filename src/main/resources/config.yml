# ==============================
# VillagerPro 2.0 配置文件
# 作者: PopCraft
# ==============================

# 是否启用调试模式（控制台输出详细日志）
debug: false

# ==============================
# 数据库
# ==============================
database:
  # sqlite（默认、本地文件）或 mysql（建议 MySQL 8.0+）
  type: sqlite
  sqlite:
    file: "plugins/VillagerPro/database.db"
  mysql:
    host: localhost
    port: 3306
    database: villagerpro
    username: root
    password: ""
    use_ssl: false
    server_timezone: "Asia/Shanghai"
  pool:
    # SQLite 会自动限制为单连接；以下连接数配置用于 MySQL
    maximum_size: 10
    minimum_idle: 2
    connection_timeout_ms: 30000

# ==============================
# 经济系统
# ==============================
economy:
  # 启用 Vault（兼容 EssentialsX、CMI 等）
  use_vault: true
  # 启用 PlayerPoints 点券系统
  use_playerpoints: true
  # 启用 ItemsAdder 自定义物品支持
  use_itemsadder: true

# ==============================
# 村庄系统
# ==============================
village:
  # 村庄最大等级
  max_level: 5

  # 村庄升级所需基础经验（每级需要的经验 = 当前等级 * base_exp_per_level）
  base_exp_per_level: 200

  # 升级到每一级所需的成本（索引 0 = 1→2，1 = 2→3，...）
  upgrade_costs:
    - # 1 → 2
      costs:
        - type: "vault"
          amount: 500
    - # 2 → 3
      costs:
        - type: "vault"
          amount: 1100
    - # 3 → 4
      costs:
        - type: "playerpoints"
          amount: 200
        - type: "vault"
          amount: 400
    - # 4 → 5
      costs:
        - type: "vault"
          amount: 2000
        - type: "playerpoints"
          amount: 600

  # 基础村民数量上限（每级可额外增加，见 upgrade_skills）
  base_villager_limit: 3

  # 仓库基础容量（物品总数量，不是箱子格数）
  base_warehouse_capacity: 50
  # 每级额外仓库容量
  warehouse_capacity_per_level: 25

# ==============================
# 村庄升级技能树（玩家每次升级可选一项）
# ==============================
village_upgrades:
  # 每次升级提供几个选项（建议 2~4）
  options_per_level: 3

  # 所有可用的升级项（可自由增减）
  available_upgrades:
    farming_boost:
      name: "农业强化"
      description: "农民产出+20%，收集范围+2格"
      icon: WHEAT
      max_level: 3
      effects:
        production_bonus_per_level: 0.20
        range_per_level: 2
      costs:
        - type: "vault"
          amount: 300

    fishing_mastery:
      name: "渔业专精"
      description: "渔夫钓鱼间隔-10%，宝藏概率+5%"
      icon: COD
      max_level: 2
      effects:
        interval_reduction_per_level: 0.10
        treasure_chance_per_level: 0.05
      costs:
        - type: "vault"
          amount: 400
        - type: "playerpoints"
          amount: 150

    villager_capacity:
      name: "基建扩张"
      description: "村民上限+1"
      icon: OAK_DOOR
      max_level: 5
      effects:
        capacity_per_level: 1
      costs:
        - type: "vault"
          amount: 600

    warehouse_expansion:
      name: "仓储扩容"
      description: "仓库容量+50格"
      icon: CHEST
      max_level: 4
      effects:
        capacity_per_level: 50
      costs:
        - type: "playerpoints"
          amount: 100

    mob_reduction:
      name: "村庄守护"
      description: "玩家附近怪物生成率-10%"
      icon: TORCH
      max_level: 2
      effects:
        spawn_reduction_per_level: 0.10
      costs:
        - type: "vault"
          amount: 200

# ==============================
# 村民系统
# ==============================
villager:
  # 村民升级所需基础经验（每级需要的经验 = 当前等级 * base_exp_per_level）
  base_exp_per_level: 100
  # 普通生产职业每个额外等级增加的单次基础产量
  production_amount_per_level: 1

  # 招募成本（支持多资源）
  recruit_cost:
    - type: "vault"
      amount: 600

  # 工作间隔（ticks，默认 2400 = 2分钟）
  work_interval_ticks: 2400
  # 到期检查间隔；较短的检查间隔才能让“快速垂钓”等加速真实生效
  work_check_interval_ticks: 20
  # 工作半径（方块）
  work_range: 5

  # 职业配置
  professions:
    farmer:
      name: "农民"
      icon: WHEAT
      work_items: [WHEAT, CARROT, POTATO, BEETROOT]
      base_amount: 3
      probability: 0.8

    fisherman:
      name: "渔夫"
      icon: COD
      work_items: [COD, SALMON, TROPICAL_FISH, PUFFERFISH]
      base_amount: 2
      probability: 0.6
      treasure_item: HEART_OF_THE_SEA

    shepherd:
      name: "牧羊人"
      icon: WHITE_WOOL
      work_items: [WHITE_WOOL, ORANGE_WOOL, MAGENTA_WOOL]
      base_amount: 1
      probability: 0.7

    librarian:
      name: "图书管理员"
      icon: ENCHANTED_BOOK
      work_items: [BOOK, EXPERIENCE_BOTTLE]
      base_amount: 1
      probability: 0.4
      special_item: ENCHANTED_BOOK

    priest:
      name: "祭司"
      icon: POTION
      work_items: [POTION]
      base_amount: 1
      probability: 0.5

    cartographer:
      name: "制图师"
      icon: MAP
      work_items: [MAP]
      base_amount: 1
      probability: 0.4
      treasure_item: FILLED_MAP

# ==============================
